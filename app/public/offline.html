<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#050505" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lexi</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #050505;
        color: #f6f7ff;
        font-family: 'Inter Variable', 'Inter Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-rendering: geometricprecision;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      .offline {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 420px;
        text-align: center;
      }

      .offline__logo {
        width: min(40vw, 112px);
        height: auto;
      }

      .offline__title {
        margin: 0;
        font-size: 21px;
        font-weight: 500;
        line-height: 1.333;
      }

      .offline__button {
        min-height: 48px;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        background: #4763f0;
        color: #ffffff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.25;
        cursor: pointer;
        transition: background 200ms ease-in-out;
        appearance: none;
      }

      @media (hover: hover) and (pointer: fine) {
        .offline__button:hover {
          background: #5578f1;
        }
      }

      .offline__button:active {
        background: #3c4ce2;
      }
    </style>
  </head>
  <body>
    <div class="offline">
      <img alt="Lexi" class="offline__logo" height="339" src="./icons/emblem.svg" width="372" />
      <h1 class="offline__title">Something went wrong</h1>
      <button class="offline__button" onclick="location.reload()" type="button">Restart</button>
    </div>
  </body>
</html>
